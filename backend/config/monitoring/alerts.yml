# ══════════════════════════════════════════════════════════════════════════════
# GUARDIAN – Règles d'alertes Prometheus
# ══════════════════════════════════════════════════════════════════════════════

groups:

  # ── INFRASTRUCTURE ────────────────────────────────────────────────────────
  - name: infrastructure
    rules:

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Utilisation CPU élevée ({{ $value | printf \"%.1f\" }}%)"
          description: "Le serveur {{ $labels.instance }} a un CPU > 85% depuis 10 min."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Mémoire critique ({{ $value | printf \"%.1f\" }}%)"
          description: "RAM > 90% sur {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Espace disque faible ({{ $value | printf \"%.1f\" }}%)"
          description: "Disque > 85% rempli sur {{ $labels.instance }}. Vérifier les backups/logs."

  # ── API GUARDIAN ───────────────────────────────────────────────────────────
  - name: guardian-api
    rules:

      - alert: APIDown
        expr: up{job="guardian-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "🔴 API Guardian DOWN"
          description: "L'API ne répond plus depuis 1 minute. Vérifier immédiatement."

      - alert: HighErrorRate
        expr: |
          sum(rate(guardian_http_request_duration_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(guardian_http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Taux d'erreur 5xx élevé ({{ $value | printf \"%.1f\" | mul 100 }}%)"
          description: "Plus de 5% des requêtes échouent avec une erreur serveur."

      - alert: SlowAPIResponses
        expr: |
          histogram_quantile(0.95,
            sum(rate(guardian_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API lente (p95 > 2s)"
          description: "Le 95e percentile du temps de réponse dépasse 2 secondes."

  # ── BASE DE DONNÉES ────────────────────────────────────────────────────────
  - name: database
    rules:

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "🔴 PostgreSQL DOWN"

      - alert: PostgresHighConnections
        expr: sum(pg_stat_activity_count) / pg_settings_max_connections > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Connexions PostgreSQL > 80% de la limite"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "🔴 Redis DOWN — Les quotas en temps réel ne fonctionnent plus"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis mémoire > 90%"

  # ── SÉCURITÉ GUARDIAN (métier) ────────────────────────────────────────────
  - name: guardian-security
    rules:

      - alert: HighTamperAttemptRate
        expr: increase(guardian_tamper_attempts_total[1h]) > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "🚨 Pic de tentatives de contournement"
          description: "Plus de 50 tentatives de contournement détectées dans la dernière heure (tous enfants confondus). Vérifier s'il s'agit d'un bug ou d'une attaque ciblée."

      - alert: AIServiceDegraded
        expr: |
          sum(rate(guardian_ai_chat_errors_total[15m]))
          /
          sum(rate(guardian_ai_chat_total[15m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Service IA dégradé (>10% d'erreurs)"
          description: "Vérifier le statut de l'API Anthropic et les quotas."

      - alert: StripeWebhookFailures
        expr: increase(guardian_stripe_webhook_errors_total[1h]) > 5
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Échecs répétés du webhook Stripe"
          description: "Vérifier la configuration du webhook et le secret de signature."

  # ── CERTIFICATS SSL ────────────────────────────────────────────────────────
  - name: ssl
    rules:

      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Certificat SSL expire dans moins de 7 jours"
          description: "Vérifier le renouvellement automatique Certbot."
