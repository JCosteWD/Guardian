# ══════════════════════════════════════════════════════════════════════════════
# GUARDIAN – Prometheus scrape configuration
# ══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:

  # ── GUARDIAN API ────────────────────────────────────────────────────────────
  # Nécessite l'ajout de prom-client dans backend (voir note ci-dessous)
  - job_name: 'guardian-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'guardian-api'
          env: 'production'

  # ── POSTGRESQL ──────────────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # ── REDIS ───────────────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # ── NODE (CPU, RAM, disque du serveur) ────────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'server'

  # ── NGINX (via stub_status, à activer dans nginx.conf) ────────────────────────
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
        labels:
          service: 'nginx'

