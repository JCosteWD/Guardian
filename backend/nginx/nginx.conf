worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── LOGGING ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── PERFORMANCE ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ── SÉCURITÉ GLOBALE ──────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── RATE LIMITING ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m  rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── UPSTREAM SERVERS ──────────────────────────────────────────────────────
    upstream guardian_api {
        server api:3000;
        keepalive 32;
    }

    upstream guardian_web {
        server web:80;
        keepalive 16;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # REDIRECT HTTP → HTTPS
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name guardian-app.com api.guardian-app.com www.guardian-app.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # API SERVER (api.guardian-app.com)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name api.guardian-app.com;

        # ── SSL ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/guardian-app.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/guardian-app.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # HSTS (31536000 = 1 an)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ── CORS ─────────────────────────────────────────────────────────────
        add_header Access-Control-Allow-Origin  "https://guardian-app.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # ── RATE LIMITING GÉNÉRAL ─────────────────────────────────────────────
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        # ── AUTH ENDPOINTS (rate limit strict) ───────────────────────────────
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://guardian_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── AI ENDPOINTS (rate limit IA) ──────────────────────────────────────
        location ~ ^/api/ai/ {
            limit_req zone=ai_limit burst=10 nodelay;
            proxy_pass http://guardian_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;  # Timeout plus long pour les réponses IA
        }

        # ── STRIPE WEBHOOK (pas de rate limit, vérification par signature) ───
        location /api/billing/webhook {
            proxy_pass http://guardian_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Ne pas modifier le body du webhook
            proxy_request_buffering off;
        }

        # ── WEBSOCKET (Socket.io) ─────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://guardian_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── OPTIONS PREFLIGHT ─────────────────────────────────────────────────
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "https://guardian-app.com";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://guardian_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;

            # Body size max 1MB
            client_max_body_size 1m;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # WEB PARENT (guardian-app.com)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name guardian-app.com www.guardian-app.com;

        ssl_certificate     /etc/nginx/ssl/guardian-app.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/guardian-app.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' https://js.stripe.com; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: https:; "
            "connect-src 'self' https://api.guardian-app.com wss://api.guardian-app.com; "
            "frame-src https://js.stripe.com;"
            always;

        root /usr/share/nginx/html;
        index index.html;

        # SPA routing – toutes les routes → index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache assets statiques
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Pas de cache pour index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
