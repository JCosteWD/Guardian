# POLITIQUE DE CONFIDENTIALITÉ (requis pour les apps enfants)
# ══════════════════════════════════════════════════════════════
privacy_policy_url: "https://guardian-app.com/privacy"
data_safety:
  data_collected:
    - type: "Email (parent)"        purpose: "Authentification"        shared: false
    - type: "Prénom enfant"         purpose: "Personnalisation IA"     shared: false
    - type: "Notes scolaires"       purpose: "Ajustement temps écran"  shared: false
    - type: "Localisation (enfant)" purpose: "Géofencing"              shared: false
    - type: "Activité apps"         purpose: "Rapports parents"        shared: false
  encryption: "AES-256-GCM via Android Keystore"
  gdpr_compliant: true
  coppa_compliant: true  # Children's Online Privacy Protection Act
  child_directed: false  # L'app parent n'est pas destinée aux enfants

