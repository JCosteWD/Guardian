## Description longue (4000 car. max)
long_desc_fr: |
  🛡️ GUARDIAN — Le contrôle parental qui protège vraiment

  Guardian est la seule application de contrôle parental qui combine une sécurité Android infranchissable avec une intelligence artificielle bienveillante. Fini les restrictions frustrantes : Guardian aide votre enfant à comprendre les règles et à les accepter.

  ✅ SÉCURITÉ RÉELLE, PAS UN GADGET
  • Empêche l'installation de nouveaux navigateurs pour contourner les filtres
  • VPN local : filtre TOUS les sites, impossible à désactiver
  • Service d'accessibilité : bloque les apps interdites instantanément
  • Démarre automatiquement au redémarrage de l'appareil
  • Chiffrement AES-256 : données sécurisées même si rooté

  ⏰ CONTRÔLE DU TEMPS D'ÉCRAN
  • Quotas quotidiens par enfant (différents semaine/week-end)
  • Heure du coucher automatique
  • Mode école : blocage total pendant les heures de classe
  • Réglages rapides en 1 clic depuis l'app parent

  📝 NOTES SCOLAIRES → AJUSTEMENT AUTOMATIQUE
  • Saisissez une note → le temps s'ajuste automatiquement
  • Connectez Pronote ou EcoleDirecte pour une sync automatique
  • Bonne note = bonus de temps. Mauvaise note = temps réduit.

  🤖 L'IA GUARDIAN (Plan Premium)
  • Votre enfant peut demander POURQUOI son temps est réduit
  • L'IA explique avec bienveillance et propose des solutions
  • Quiz adaptatifs : réussir = gagner du temps bonus
  • Détecte si votre enfant est en difficulté et vous alerte
  • Journal de bord hebdomadaire personnalisé

  📍 GÉOFENCING
  • Zones intelligentes (maison, école, grands-parents…)
  • Alertes automatiques à chaque arrivée/départ
  • Mode école s'active automatiquement à l'école

  👨‍👩‍👧 MULTI-PARENT
  • Invitez le 2ème parent, les grands-parents, la nounou
  • Droits différenciés : admin, parent, gardien, observateur

  🏆 GAMIFICATION
  • Badges, points, niveaux, streaks pour motiver les enfants
  • L'IA félicite les efforts et encourage les progrès

  💎 PLANS
  • Gratuit : 1 enfant, contrôles basiques
  • Family (4,99€/mois) : 3 enfants, multi-parent, géofencing
  • Premium (9,99€/mois) : tout + IA Guardian complète

  Essai gratuit 14 jours sur les plans payants. Sans engagement.

  ---
  Guardian respecte strictement la vie privée de votre famille.
  Données chiffrées. Conformité RGPD totale. Aucune publicité.

long_desc_en: |
  🛡️ GUARDIAN — The Parental Control That Actually Works

  Guardian is the only parental control app that combines impenetrable Android security with a caring AI assistant. No more frustrating restrictions: Guardian helps your child understand and accept the rules.

  ✅ REAL SECURITY, NOT JUST AN APP
  • Prevents installing alternative browsers to bypass filters
  • Local VPN: filters ALL websites, impossible to disable
  • Accessibility service: blocks forbidden apps instantly
  • Auto-restarts on device reboot
  • AES-256 encryption: data secured even if rooted

  🤖 GUARDIAN AI (Premium Plan)
  • Your child can ask WHY their screen time was reduced
  • AI explains kindly and proposes solutions
  • Adaptive quizzes: pass to earn bonus time
  • Detects if your child is struggling and alerts you

  Free 14-day trial on paid plans. No commitment.

