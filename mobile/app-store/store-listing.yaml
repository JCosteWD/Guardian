# ASSETS REQUIS (à créer)
# ══════════════════════════════════════════════════════════════

assets:
  # Icône application
  icon:
    - size: "512x512"   format: "PNG"  path: "assets/icon_512.png"
    - size: "192x192"   format: "PNG"  path: "assets/icon_192.png"  # Adaptive icon foreground
    - size: "108x108"   format: "PNG"  path: "assets/icon_108.png"  # Legacy

  # Feature Graphic (Play Store banner)
  feature_graphic:
    size: "1024x500"
    format: "PNG ou JPG"
    path: "assets/feature_graphic.png"
    description: |
      Design: fond dégradé sombre (#0a0a12 → #1a1a2e),
      Logo Guardian centré avec effet glow violet,
      Tagline: "Le contrôle parental qui protège vraiment"
      Quelques UI mockups en flottant

  # Screenshots (minimum 2, maximum 8)
  screenshots_parent:
    format: "PNG"
    dimensions: "1080x1920 (portrait)"
    files:
      - name: "01_dashboard.png"
        desc: "Tableau de bord parent avec barres de quota en temps réel"
      - name: "02_quick_actions.png"
        desc: "Actions rapides : -30min, +30min, Mode devoirs, Bloquer"
      - name: "03_child_profile.png"
        desc: "Profil enfant avec anneau SVG animé et stats"
      - name: "04_grades.png"
        desc: "Saisie de note avec ajustement automatique du temps"
      - name: "05_geofencing.png"
        desc: "Zones GPS avec types : Maison, École, Zone restreinte"
      - name: "06_subscription.png"
        desc: "Plans Free / Family / Premium avec comparatif"
      - name: "07_multi_parent.png"
        desc: "Inviter un 2ème parent avec droits différenciés"
      - name: "08_notifications.png"
        desc: "Alertes en temps réel : quota, tentative contournement"

  screenshots_child:
    format: "PNG"
    dimensions: "1080x1920 (portrait)"
    files:
      - name: "01_home.png"
        desc: "Launcher sécurisé avec quota ring et apps autorisées"
      - name: "02_ai_chat.png"
        desc: "Chat avec Guardian IA : explication des règles"
      - name: "03_quiz.png"
        desc: "Quiz adaptatif pour gagner du temps bonus"
      - name: "04_rewards.png"
        desc: "Écran gamification : badges, niveau, streak"
      - name: "05_blocking.png"
        desc: "Overlay de blocage animé avec proposition de quiz"

  # Vidéo promotionnelle (optionnel mais fortement recommandé)
  promo_video:
    duration: "30-120 secondes"
    format: "MP4, 1080p"
    script: |
      0-5s  : Logo Guardian avec animation shield
      5-15s : Parents configurent des règles en quelques clics
      15-25s: Enfant parle à l'IA Guardian, fait un quiz, gagne du temps
      25-30s: Tagline + CTA "Télécharger gratuitement"

